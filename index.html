<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Groyper Habit Tracker</title>
  
  <meta name="description" content="Track your daily habits with your Groyper frog companion">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="weather-overcast">
  <!-- Dynamic Weather Background -->
  <div class="weather-bg" id="weatherBg">
    <div class="rain-container" id="rainContainer"></div>
  </div>

  <div class="app-container">
    <!-- Weather Badge -->
    <div class="weather-badge fade-in" id="weatherBadge">
      <span class="weather-emoji" id="weatherEmoji">☁️</span>
      <span class="weather-temp" id="weatherTemp">--°C</span>
      <span class="weather-desc" id="weatherDesc">Loading...</span>
    </div>

    <!-- Groyper Frog Pet -->
    <div class="frog-section fade-in">
      <div class="frog-container" id="frogContainer">
        <!-- SVG will be injected here by frog.js -->
      </div>
      
      <div class="score-display">
        <div class="score-value" id="scoreValue">0</div>
        <div class="score-label">Score</div>
        <div class="stage-name stage-1" id="stageName">Defeated</div>
      </div>
      
      <div class="progress-bar-container">
        <div class="progress-bar-fill stage-1" id="progressBar" style="width: 0%"></div>
      </div>
    </div>

    <!-- Habits List -->
    <div class="habits-section fade-in">
      <div class="section-header">
        <h2 class="section-title">Daily Habits</h2>
        <button class="add-habit-btn" id="addHabitBtn">
          <span>+ Add</span>
        </button>
      </div>
      
      <div class="habit-list" id="habitList">
        <!-- Habits will be rendered here -->
        <div class="loading">Loading habits...</div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="calendar-section fade-in">
      <div class="section-header" style="margin-bottom: var(--gap-sm);">
        <h2 class="section-title">History</h2>
      </div>
      
      <div class="date-indicator" id="dateIndicator">
        <span>Editing: <strong id="selectedDateLabel">Today</strong></span>
        <button class="today-btn hidden" id="returnToTodayBtn">Go to Today</button>
      </div>

      <div class="calendar-header">
        <button class="calendar-nav-btn" id="prevMonthBtn">◀</button>
        <span class="calendar-month-label" id="monthLabel">June 2026</span>
        <button class="calendar-nav-btn" id="nextMonthBtn">▶</button>
      </div>
      
      <div class="calendar-grid" id="calendarGrid">
        <!-- Days of week -->
        <div class="calendar-day-header">Mo</div>
        <div class="calendar-day-header">Tu</div>
        <div class="calendar-day-header">We</div>
        <div class="calendar-day-header">Th</div>
        <div class="calendar-day-header">Fr</div>
        <div class="calendar-day-header">Sa</div>
        <div class="calendar-day-header">Su</div>
        <!-- Calendar days injected here -->
      </div>
    </div>
  </div>

  <!-- Motivational Message Popup -->
  <div class="motivation-popup stage-1" id="motivationPopup">
    <div class="motivation-text" id="motivationText">LOCK IN!!!!</div>
  </div>

  <!-- Add/Edit Habit Modal -->
  <div class="modal-overlay" id="habitModal">
    <div class="modal-content">
      <div class="modal-handle"></div>
      <h3 class="modal-title" id="modalTitle">New Habit</h3>
      
      <div class="form-group">
        <label class="form-label" for="habitName">Habit Name</label>
        <input type="text" id="habitName" class="form-input" placeholder="e.g. Morning Run" autocomplete="off">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="habitWeight">Weight (Importance)</label>
        <input type="number" id="habitWeight" class="form-input" placeholder="1-10" min="1" max="100" value="10">
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
        <button class="btn btn-primary" id="saveHabitBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="app.js"></script>
  
  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
